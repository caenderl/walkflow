name: Release

# Builds the desktop app for a release tag and attaches it to a draft release, which is published by hand.
# Normally called by release-please.yml after a release pull request was merged (the draft already exists).
# Still works by hand: bump the version in package.json, commit, push the tag "v<version>".
# macOS is built here by default. If GitHub has no macOS runner free, set the repository variable MAC_BUILD to "local":
# the job is left out, and `scripts/release-mac.sh <tag>` builds it on a Mac and adds it to the draft (README, "Releasing").
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.matrix.outputs.os }}
    steps:
      - id: matrix
        env:
          MAC_BUILD: ${{ vars.MAC_BUILD }}
        run: |
          if [ "$MAC_BUILD" = local ]; then
            echo 'os=["windows-latest","ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["macos-latest","windows-latest","ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Tag matches the version in package.json?
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"

      - name: Build the desktop app
        run: npm run dist
        env:
          # Unsigned for now (macOS ad hoc). For signing/notarization see electron-builder.config.cjs.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: walkflow-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach to the draft release (create it for a tag pushed by hand)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # From release-please: its notes (changelog) first, then download and install notes
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
            if ! grep -q '^### Download' notes.md; then printf '\n\n' >> notes.md; cat .github/release-notes.md >> notes.md; fi
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Walkflow $TAG" --notes-file notes.md
          else
            gh release create "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Walkflow $TAG" \
              --notes-file .github/release-notes.md \
              --generate-notes
          fi
