name: Pages

on:
  # Manual for now (Actions → Pages → Run workflow). Once the legal notice and privacy
  # pages are filled in, uncomment this to deploy on every push:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Legal pages filled in?
        run: |
          if grep -rl "TODO" public/legal; then
            echo "::error::The legal pages (public/legal) still contain TODO placeholders. Fill them in first, then deploy."
            exit 1
          fi

      - id: pages
        uses: actions/configure-pages@v6

      # The download links of the product page name the files of the latest published release (not a draft)
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "Latest release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The product page (site/) at the root, the web app under app/
      - run: npm run build:pages
        env:
          WALKFLOW_RELEASE: ${{ steps.release.outputs.tag }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/app/
          # Optional, set as a repository variable (Settings → Secrets and variables → Actions → Variables)
          VITE_DONATION_URL: ${{ vars.DONATION_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
