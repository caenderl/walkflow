name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Impressum und Datenschutz ausgefüllt?
        run: |
          if grep -l "TODO" public/impressum.html public/datenschutz.html; then
            echo "::error::Impressum/Datenschutz enthalten noch TODO-Platzhalter. Erst ausfüllen, dann deployen."
            exit 1
          fi

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Optional, als Repository-Variable setzen (Settings → Secrets and variables → Actions → Variables)
          VITE_DONATION_URL: ${{ vars.DONATION_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
