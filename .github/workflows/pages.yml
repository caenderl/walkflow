name: Pages

on:
  # Manual for now (Actions → Pages → Run workflow). Once the legal notice and privacy
  # pages are filled in, uncomment this to deploy on every push:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Legal pages filled in?
        run: |
          if grep -rl "TODO" public/legal; then
            echo "::error::The legal pages (public/legal) still contain TODO placeholders. Fill them in first, then deploy."
            exit 1
          fi

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Optional, set as a repository variable (Settings → Secrets and variables → Actions → Variables)
          VITE_DONATION_URL: ${{ vars.DONATION_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
