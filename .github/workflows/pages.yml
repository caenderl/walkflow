name: Pages

on:
  # Publishing a release (the draft from release.yml, published by hand) rebuilds and deploys the site, so the download
  # links and the version on the product page follow it. Release events run the workflow file of the release's tag.
  release:
    types: [published]
  # By hand: Actions → Pages → Run workflow (e.g. after a change to site/ between releases)
  workflow_dispatch:

# The site is served from the repository walkflow-app/walkflow-app.github.io (the organization's own address,
# https://walkflow-app.github.io/). This workflow builds it and pushes the result there with a deploy key:
# the secret PAGES_DEPLOY_KEY is the private half, the public half is a deploy key with write access in that repository.
permissions:
  contents: read

env:
  SITE_REPO: walkflow-app/walkflow-app.github.io
  SITE_URL: https://walkflow-app.github.io

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A release of the treadmill library (npm-publish.yml) does not change the site
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Legal pages filled in?
        run: |
          if grep -rl "TODO" public/legal; then
            echo "::error::The legal pages (public/legal) still contain TODO placeholders. Fill them in first, then deploy."
            exit 1
          fi

      # The download links of the product page name the files of the latest published release (not a draft)
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app's releases only (tags v…); the treadmill library has releases of its own (ftms-treadmill-v…)
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft | not) | select(.prerelease | not) | select(.tag_name | startswith("v"))][0].tag_name')
          echo "Latest release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The product page (site/) at the root, the web app under app/
      - run: npm run build:pages
        env:
          WALKFLOW_RELEASE: ${{ steps.release.outputs.tag }}
          BASE_PATH: /app/
          # The former address (the project page of this repository) forwards to the new one
          OLD_PATH: /walkflow

      # One commit with the whole site, replacing what was there (the history of the site is the history of this repository)
      - name: Push the site
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          cd pages
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site from $GITHUB_REPOSITORY@$GITHUB_SHA"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes" git push -f "git@github.com:$SITE_REPO.git" main
          echo "Deployed to $SITE_URL/" >> "$GITHUB_STEP_SUMMARY"
