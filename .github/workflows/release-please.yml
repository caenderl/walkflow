name: Release Please

# On every push to main, release-please keeps a release pull request up to date: next version (SemVer, from the
# Conventional Commit titles) and CHANGELOG.md. Merging it creates the tag and a draft release; the desktop app is
# then built here and attached to it. The draft is published by hand after the hardware checks.
# The treadmill library (packages/ftms-treadmill) gets its own version, changelog and draft pre-release
# (ftms-treadmill-v<version>) in the same release pull request; publishing that draft publishes it to npm (npm-publish.yml).
# Config: release-please-config.json, current version: .release-please-manifest.json.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag created with the workflow token does not start other workflows, so the build is called from here
  desktop:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
